name: Release

# Releases carry the installer and nothing else. A version bump on main builds
# Notch-Setup-<version>.exe on a Windows runner — the one place a Windows
# installer can be produced without Wine — and attaches it to a release. If that
# version already has a release, the run looks at it and stops, so ordinary
# pushes to main cost a few seconds and never overwrite a published download.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Is this version already released?
        id: check
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exists = $false
          gh release view "v${{ steps.version.outputs.version }}" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) { $exists = $true }
          if ($exists) {
            "exists=true" >> $env:GITHUB_OUTPUT
            Write-Host "v${{ steps.version.outputs.version }} is already published; nothing to build."
          } else {
            "exists=false" >> $env:GITHUB_OUTPUT
          }
          # A missing release is the normal answer here, and its exit code is not
          # this step's: the runner would otherwise fail the job on it.
          exit 0

      - uses: actions/setup-node@v4
        if: steps.check.outputs.exists != 'true'
        with:
          node-version: 20
          cache: npm

      - name: Install
        if: steps.check.outputs.exists != 'true'
        run: npm ci

      # The voice folder has to exist even if a download is refused, or the packer
      # has nothing to copy into the package.
      - name: Prepare the voice folder
        if: steps.check.outputs.exists != 'true'
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path tts, tts/piper | Out-Null

      # The Piper voice travels inside the installer, but it is not in the
      # repository (tts/ is ignored), so the runner fetches exactly what the
      # package expects: tts/piper/piper.exe and the two .onnx voices beside it.
      # curl.exe is used rather than Invoke-WebRequest: it follows the redirect
      # to the CDN, retries, and returns an exit code instead of a PowerShell
      # error, so a refused download is a warning and not a broken job.
      - name: Fetch the Piper voice
        if: steps.check.outputs.exists != 'true'
        continue-on-error: true
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          curl.exe -L --fail --retry 3 --retry-delay 2 -o piper.zip "https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_windows_amd64.zip"
          if (Test-Path piper.zip) {
            try { Expand-Archive piper.zip -DestinationPath tts -Force }
            catch { Write-Warning "piper zip: $_" }
          }
          $voices = @(
            @{ name = 'en_GB-alan-medium'; url = 'https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_GB/alan/medium/en_GB-alan-medium' },
            @{ name = 'da_DK-talesyntese-medium'; url = 'https://huggingface.co/rhasspy/piper-voices/resolve/main/da/da_DK/talesyntese/medium/da_DK-talesyntese-medium' }
          )
          foreach ($voice in $voices) {
            foreach ($suffix in @('.onnx', '.onnx.json')) {
              curl.exe -L --fail --retry 3 --retry-delay 2 -o "tts/$($voice.name)$suffix" "$($voice.url)$suffix"
            }
          }
          Get-ChildItem tts -Recurse -File | Select-Object -ExpandProperty FullName
          if (-not (Test-Path tts/piper/piper.exe)) { Write-Warning 'piper.exe did not arrive; the installer will fall back to the Windows voice.' }
          exit 0

      # PowerShell's Add-Type refused this C# on a machine the app has to run on:
      # the type was never created (TypeNotFound), the hook never installed, and the
      # Windows key stayed Windows'. Compiled here it is a small exe the app runs
      # directly, so no compiler is needed at run time. If it fails even here the
      # output is attached to the release, where it can be read from outside.
      - name: Build the native key hook
        if: steps.check.outputs.exists != 'true'
        continue-on-error: true
        shell: pwsh
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (-not (Test-Path $csc)) {
            'csc.exe not found' | Tee-Object -FilePath hook-compile.log
            Copy-Item hook-compile.log hook-compile-error.txt
            exit 1
          }
          # UIAutomationClient, UIAutomationTypes and WindowsBase are not beside csc:
          # they live in the GAC or the .NET Framework targeting pack. A bare name is
          # only searched for in the compiler's own folder, which is precisely why
          # Add-Type failed on a real machine (TypeNotFound) and the hook never ran.
          # So they are found first and passed by full path.
          $refs = @(
            "/r:$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\System.dll",
            "/r:$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\System.Core.dll",
            "/r:$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\System.Drawing.dll",
            "/r:$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\System.Management.dll"
          )
          $roots = @(
            "$env:WINDIR\Microsoft.NET\assembly",
            "${env:ProgramFiles(x86)}\Reference Assemblies\Microsoft\Framework\.NETFramework",
            "$env:ProgramFiles\Reference Assemblies\Microsoft\Framework\.NETFramework"
          )
          foreach ($name in @('UIAutomationClient.dll', 'UIAutomationTypes.dll', 'WindowsBase.dll')) {
            $hit = $null
            foreach ($root in $roots) {
              if (-not (Test-Path $root)) { continue }
              $hit = Get-ChildItem $root -Recurse -Filter $name -ErrorAction SilentlyContinue |
                Sort-Object FullName | Select-Object -First 1
              if ($hit) { break }
            }
            if ($hit) { $refs += "/r:$($hit.FullName)" }
            else { "missing $name" | Out-String }
          }
          & $csc /nologo /target:exe /out:hook\notchhook.exe @refs hook\JarvisWinHook.cs hook\Program.cs *>&1 |
            Tee-Object -FilePath hook-compile.log
          $code = $LASTEXITCODE
          if ($code -ne 0 -or -not (Test-Path hook\notchhook.exe)) {
            Copy-Item hook-compile.log hook-compile-error.txt -Force
            exit 1
          }
          Get-Item hook\notchhook.exe | Select-Object Name, Length

      # The log of a failed run is not readable without admin rights, so the
      # failure is repeated as an annotation, which is public: the last lines of
      # the packer's output are what say why it stopped.
      - name: Build the installer
        if: steps.check.outputs.exists != 'true'
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          Write-Host "node $(node -v)"
          Write-Host "electron-builder $(npx electron-builder --version)"
          npm run dist:installer 2>&1 | Tee-Object -FilePath build.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $tail = Get-Content build.log -Tail 8
            foreach ($line in $tail) {
              $safe = $line.Trim().Replace('%', '%25')
              if ($safe) { Write-Host "::error title=Build failed::$safe" }
            }
          }
          exit $code

      - name: Release notes
        if: steps.check.outputs.exists != 'true'
        shell: pwsh
        run: |
          $text = Get-Content README.md -Raw
          $match = [regex]::Match($text, '(?s)\*\*v[\d.]+\*\*.*?(?=\r?\n\*\*v[\d.]+\*\*)')
          $body = if ($match.Success) { $match.Value.Trim() } else { "Notch ${{ steps.version.outputs.version }}" }
          $body += "`n`n**Download** — the installer only: ``Notch-Setup-${{ steps.version.outputs.version }}.exe``"
          $body | Set-Content -Encoding utf8 release-notes.md

      - name: Publish
        if: steps.check.outputs.exists != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" `
            "dist/Notch-Setup-${{ steps.version.outputs.version }}.exe" `
            --repo "${{ github.repository }}" `
            --title "Notch ${{ steps.version.outputs.version }}" `
            --notes-file release-notes.md `
            --target "${{ github.sha }}"

      - name: Attach a hook compile error
        if: steps.check.outputs.exists != 'true' && hashFiles('hook-compile-error.txt') != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "v${{ steps.version.outputs.version }}" hook-compile-error.txt `
            --repo "${{ github.repository }}" --clobber
