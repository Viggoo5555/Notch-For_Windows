<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;"
    />
    <title>System</title>
    <link rel="stylesheet" href="widget.css" />
  </head>
  <body>
    <main class="card" id="card">
      <div class="wg-glass" id="wgGlass" aria-hidden="true">
        <img class="wg-source" id="wgSource" alt="" decoding="async" />
        <div class="wg-pane" id="wgPane"></div>
        <span class="wg-tint"></span>
      </div>

      <header class="head">
        <span class="dot" id="dot"></span>
        <span class="title">System</span>
        <span class="spacer"></span>
        <button class="x" id="close" type="button" aria-label="Close widget" title="Close">
          <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3.2 3.2l5.6 5.6M8.8 3.2L3.2 8.8" /></svg>
        </button>
      </header>

      <div class="meters">
        <div class="meter">
          <span class="meter-label">CPU</span>
          <span class="bar"><i id="barCpu"></i></span>
          <span class="meter-val" id="valCpu">—</span>
        </div>
        <div class="meter">
          <span class="meter-label">Memory</span>
          <span class="bar"><i id="barRam"></i></span>
          <span class="meter-val" id="valRam">—</span>
        </div>
        <div class="meter">
          <span class="meter-label">Disk</span>
          <span class="bar"><i id="barDisk"></i></span>
          <span class="meter-val" id="valDisk">—</span>
        </div>
      </div>

      <section class="breakdown" id="breakdown" aria-hidden="true">
        <div class="bhead">Top CPU</div>
        <ol class="plist" id="topCpu"></ol>
        <div class="bhead">Top memory</div>
        <ol class="plist" id="topRam"></ol>
      </section>

      <footer class="hint" id="hint">Press for details · drag to move</footer>
    </main>
    <script type="module" src="widget.js"></script>
  </body>
</html>
