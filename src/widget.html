<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;"
    />
    <title>Widget</title>
    <link rel="stylesheet" href="widget.css" />
  </head>
  <body>
    <main class="card" id="card">
      <div class="wg-glass" id="wgGlass" aria-hidden="true">
        <img class="wg-source" id="wgSource" alt="" decoding="async" />
        <div class="wg-pane" id="wgPane"></div>
        <span class="wg-tint"></span>
      </div>

      <header class="head">
        <span class="dot" id="dot"></span>
        <span class="title" id="wTitle">System</span>
        <span class="spacer"></span>
        <button
          class="x min"
          id="minimize"
          type="button"
          aria-label="Minimize to the overlay"
          title="Minimize to the performance overlay"
        >
          <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3 8.2h6" /></svg>
        </button>
        <button
          class="x restore"
          id="restore"
          type="button"
          aria-label="Open the System card again"
          title="Back to the System card"
        >
          <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M4.4 7.6L9.6 2.4M6.6 2.4h3v3" /></svg>
        </button>
        <button class="x" id="close" type="button" aria-label="Close widget" title="Close">
          <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3.2 3.2l5.6 5.6M8.8 3.2L3.2 8.8" /></svg>
        </button>
      </header>

      <div class="body" id="wBody"></div>

      <footer class="hint" id="wHint">Press for details · drag to move</footer>
    </main>
    <script type="module" src="widget.js"></script>
  </body>
</html>
